# CI for ScanBackDoors (TZ v2 §9.2).
#
# Actions are pinned to commit SHAs, not to moving tags. Each pin below was read from
# the action's own repository with `git ls-remote --tags <url>` on 2026-11-28; the tag
# name is kept in the comment next to it. For an *annotated* tag the SHA that ls-remote
# prints without `^{}` is a tag object - the pin has to be the commit it points at, so
# `git ls-remote --tags <url> 'refs/tags/v7^{}'` is the command that produced these
# values. Re-verify before changing one, and never copy a pin from a blog post.
#
# What each job is for:
#   tests        - the whole suite, on every supported interpreter, with AND without the
#                  optional YARA engine. The "without" leg is not a formality: it is
#                  where the project's central promise (the scanner works with nothing
#                  installed) is actually checked.
#   floor        - Python 3.6 and 3.8, the two oldest interpreters the project promises,
#                  in their real images (a 3.6 job cannot be simulated by a newer one).
#   quality      - lint, bandit, and the coverage gate over the whole process family.
#   self-scan    - the scanner scans this repository and publishes its SARIF: the tool
#                  that looks for backdoors must not be the one that carries one.
#   benchmark    - a small run of benchmarks/bench_scan.py: cheap, and it fails if the
#                  measurement harness itself breaks (it reports; it is not the budget
#                  authority - see the comment there).
#
# There is deliberately no `schedule:` trigger: a scheduled workflow runs from the
# default branch only, and GitHub disables it automatically in a public repository
# after 60 days without activity, so a cron is a maintenance decision for the owner
# (docs/OPEN_QUESTIONS.md), not a default to switch on and forget.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Two pushes to the same branch: only the newest run matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Windows runners default to a legacy console code page; the tools print findings in
  # the language of the site they scanned, which is not always representable there.
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: "1"

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}${{ matrix.yara && ' + YARA' || ' (nothing installed)' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.13"
            yara: true
          - os: ubuntu-latest
            python: "3.13"
            yara: false
          - os: ubuntu-latest
            python: "3.11"
            yara: true
          - os: windows-latest
            python: "3.13"
            yara: true
          - os: windows-latest
            python: "3.13"
            yara: false
          - os: windows-latest
            python: "3.11"
            yara: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "${{ matrix.python }}"
      # Only this package, only on this leg, and pinned: it is the single optional
      # dependency the suite changes behaviour for. cryptography is exercised by
      # tests/test_updater.py through a stand-in, so installing it here would only test
      # PyPI; the legs without it are the ones that matter.
      - name: Install the optional YARA engine
        if: matrix.yara
        run: python -m pip install "yara-python==4.5.4"
      # Says which leg it is: a suite that silently skipped every YARA case would look
      # exactly like a suite that passed them.
      - name: Report which optional engines the suite will see
        run: >
          python -c "import importlib.util;
          print('yara-python visible to the tests:', bool(importlib.util.find_spec('yara')))"
      - name: Run the whole suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

  floor:
    name: Python ${{ matrix.python }} (the supported floor)
    # The real interpreter, in the official image, pinned by digest (the digest was read
    # from the registry's Docker-Content-Digest on 2026-11-28). Not a setup-python leg:
    # 3.6 is not in a runner's tool cache any more, and "we support 3.6" is a claim about
    # an interpreter this repository does not control.
    #
    # The image is `slim` and has no git, so the repository is checked out on the runner
    # and mounted into the container instead of checking it out inside the job; the tests
    # that need git skip themselves there, which is why the job also runs --self-test and
    # the --help of the other tools directly.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.6"
            image: python:3.6-slim@sha256:2cfebc27956e6a55f78606864d91fe527696f9e32a724e6f9702b5f9602d0474
          - python: "3.8"
            image: python:3.8-slim@sha256:1d52838af602b4b5a831beb13a0e4d073280665ea7be7f69ce2382f29c5a613f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # The whole suite, stdlib only: the promise is tested where it is made, including
      # the tests that launch the CLI, the cleaner and the baseline tool as children.
      # Nothing is installed into the container - requirements-dev.txt needs 3.11+ and
      # requirements-optional.txt has no wheels for this interpreter.
      - name: Run the whole suite on ${{ matrix.python }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work "${{ matrix.image }}" \
            sh -c 'python -V && python -m unittest discover -s tests -p "test_*.py"'
      # The cheapest possible proof for the person supporting a customer: the scanner
      # starts, its own checks pass, the version is readable, the others parse.
      - name: --self-test, --version and the other tools
        run: |
          docker run --rm -v "$PWD:/work" -w /work "${{ matrix.image }}" \
            sh -c 'python src/scan_backdoors.py --self-test \
                    && python src/scan_backdoors.py --version \
                    && python src/updater.py --help > /dev/null \
                    && python src/clean_malware.py --help > /dev/null \
                    && python src/joomla_baseline.py --help > /dev/null'

  quality:
    name: Lint, bandit, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install the development tools
        run: python -m pip install -r requirements-dev.txt
      # The coverage number below is taken with the optional engine PRESENT: a
      # percentage for engines/yara_engine.py measured in a leg where its tests skipped
      # would say nothing about that file. The legs that install nothing are the
      # `tests` matrix and they are where the "works with nothing installed" promise is
      # proven - a different question, answered separately.
      - name: Install the optional YARA engine
        run: python -m pip install "yara-python==4.5.4"
      # ruff.toml is the policy: it selects the rule families that found real defects and
      # records why each exception exists. Five directories - shipped code, helpers,
      # tests and benchmarks are held to the same standard as what we ship.
      - name: ruff
        run: python -m ruff check src engines tests tools benchmarks
      # The skip list is explicit rather than a config file so that adding a suppression
      # is visible in the diff of the pull request. Each entry describes a deliberate
      # design decision (md5 as wordpress.org's catalogue key, ElementTree on a manifest
      # that already had DOCTYPE refused, launching a browser, subprocess without a
      # shell) - not an unread finding.
      - name: bandit
        run: >
          python -m bandit -q -r src engines tools
          -s B101,B104,B105,B110,B112,B310,B314,B324,B404,B405,B603,B606,B607
      # Coverage of the shipped code, over the whole family of processes the tests spawn.
      # tools/coverage_run.py exists because the plain `coverage run -m unittest` recipe
      # measures the parent only, and this project's CLI, GUI and cleaner are driven as
      # child processes; it also hands those children absolute source paths, without
      # which they resolve `source = src` against their own cwd and record nothing.
      #
      # TZ §9.1 asks for 70 % of the *pipeline core*, so the gate is per module: engines/
      # and src/scan_backdoors.py must each reach it, and so must the total. Measured on
      # 2026-11-28 with this recipe: engines 90.8 % (84-97 % per file), scan_backdoors.py
      # 80.4 %, total 77.3 %. src/scan_backdoors_gui.py (65.4 %) is deliberately not
      # gated: docs/ARCHITECTURE.md says what the number does not see and why the
      # end-to-end GUI tests are not the same thing as a line count.
      - name: "Coverage gate (TZ 9.1: the pipeline core at 70 %)"
        run: >
          python tools/coverage_run.py --require 70
          --core engines --core src/scan_backdoors.py --show short

  self-scan:
    name: The scanner scans itself
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.0.0
        with:
          python-version: "3.13"
      # The tool that looks for backdoors must not be the one that carries one. Our own
      # documentation quotes the markers the scanner searches for (a changelog entry that
      # names a backdoor family is a [CRITICAL] hit by the scanner's own rules), and
      # tests/payloads holds the sealed samples - so the gate is over the code, and the
      # whole tree is scanned a second time into the artifact for a human to read.
      - name: Scan the shipped code (a finding here fails the build)
        run: |
          python src/scan_backdoors.py . --no-progress --no-csv \
            --exclude-dir tests,docs,.git --exclude-ext md,b64,txt \
            --json scan-report.json --sarif scan-report.sarif
      - name: Scan the whole tree into the report
        if: always()
        continue-on-error: true
        run: |
          python src/scan_backdoors.py . --no-progress --no-csv \
            --json scan-report-full.json --sarif scan-report-full.sarif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: self-scan
          path: |
            scan-report.json
            scan-report.sarif
            scan-report-full.json
            scan-report-full.sarif
          if-no-files-found: error
      # To publish the SARIF into the repository's Security tab, uncomment this step -
      # it needs code scanning to be enabled, and on a private repository that needs
      # GitHub Advanced Security, so it stays the owner's decision (OPEN_QUESTIONS #17).
      # The pin is the commit of github/codeql-action v4 verified on 2026-11-28
      # (its upload-sarif/action.yml exists at this commit).
      # - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934  # v4
      #   if: always()
      #   with:
      #     sarif_file: scan-report.sarif

  benchmark:
    name: Benchmark smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the optional YARA engine
        run: python -m pip install "yara-python==4.5.4"
      # A tiny rule package: the point is that the engine loads, compiles and scans, not
      # that CI is a stopwatch. --budget is widened to 2.5 here because a shared runner
      # is not a timing authority; the +30 % of TZ §9.3 is enforced by the tool itself
      # when it is run on fixed hardware against benchmarks/reference/.
      - name: Generate a rule package
        run: |
          mkdir -p bench-rules
          for i in 1 2 3 4 5 6; do
            printf 'rule SbCiBench%s {\n  strings:\n    $a = "SBD_CI_MARKER_%s" ascii wide\n  condition:\n    $a\n}\n' "$i" "$i" > "bench-rules/ci$i.yar"
          done
      - name: Measure
        run: |
          python benchmarks/bench_scan.py --files 800 --yara-rules bench-rules --budget 2.5 \
            --out bench-record.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.1
        if: always()
        with:
          name: benchmark-record
          path: bench-record.json
          if-no-files-found: error
